# REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# Exclusiones de falsos positivos antes de que se evalúen las reglas CRS.
# Referencia: https://coreruleset.org/docs/concepts/false_positives_tuning/

# ── nginx-prometheus-exporter ─────────────────────────────────────────────────
# El exporter no envía cabecera Accept al hacer scraping de /nginx_status.
# Regla 920300: "Request Missing an Accept Header" (paranoia-level/2)
SecRule REQUEST_URI "@beginsWith /nginx_status" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920300"

# ── API endpoints (JSON responses) ───────────────────────────────────────────
# CRS phase-4 outbound rules (950xxx-959xxx) are designed for HTML error pages.
# On JSON data (album titles, cover URLs, artist names) they produce false
# positives. Disable them for any request path containing /api/.
SecRule REQUEST_URI "@rx (?:^|/)api/" \
    "id:1001,\
    phase:3,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=950000-959999"
