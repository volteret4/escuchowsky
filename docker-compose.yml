services:
  escuchowsky:
    build:
      context: ./
      dockerfile: Dockerfile.escuchowsky
    container_name: escuchowsky
    restart: unless-stopped
    environment:
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - DB_PATH=/app/db/must_hear_rym_new.db
      - PYTHONDONTWRITEBYTECODE=1
      - HOME=/tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    volumes:
      - ./db:/app/db
      - ./logs/escuchowsky:/app/logs
    networks:
      - musica

  tumtumpa:
    build:
      context: ./
      dockerfile: Dockerfile.tumtumpa
    container_name: tumtumpa
    restart: unless-stopped
    environment:
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - PYTHONDONTWRITEBYTECODE=1
      - HOME=/tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - ./logs/tumtumpa:/app/logs
    networks:
      - musica

  musthear:
    build:
      context: ./
      dockerfile: Dockerfile.musthear
    container_name: musthear
    restart: unless-stopped
    environment:
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - DB_PATH=/app/db/must_hear_rym_new.db
      - PYTHONDONTWRITEBYTECODE=1
      - HOME=/tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    volumes:
      - ./db:/app/db
      - ./logs/musthear:/app/logs
    networks:
      - musica

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter@sha256:bf76e58df548a13e52bd543ac70f6d3d667e14884e8b51c149bd81994ca75ccd
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/nginx_status
    depends_on:
      - nginx
    networks:
      - musica

  node-exporter:
    image: prom/node-exporter@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - ${HOME}/contenedores/nginx/crowdsec_textfiles:/textfiles:ro
    command:
      - "--collector.textfile.directory=/textfiles"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run)($$|/)"
    ports:
      - "9100:9100"
    networks:
      - musica

  nginx:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8085:8080"
      - "8443:8443"
    environment:
      - CROWDSEC_ENABLE=true
      - CROWDSEC_LABELS_TYPE=nginx

      # ── TLS ────────────────────────────────────────────────────────────────
      # Cert del servidor catch-all (default_server). Usar fullchain para OCSP stapling.
      - SSL_CERT_FILE=/etc/nginx/ssl/escuchowsky/fullchain.pem
      - SSL_CERT_KEY_FILE=/etc/nginx/ssl/escuchowsky/key.pem
      # - SSL_PORT=8443
      # - SSL_PROTOCOLS=TLSv1.2 TLSv1.3
      # - SSL_CIPHERS=ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:...
      # - SSL_PREFER_CIPHERS=off
      # - SSL_DH_BITS=2048
      # - SSL_OCSP_STAPLING=on
      # - SSL_VERIFY=off          # mTLS clientes (lo manejamos en server_params.conf)
      # - SSL_VERIFY_DEPTH=1
      # - NGINX_ALWAYS_TLS_REDIRECT=off

      # ── ModSecurity core ───────────────────────────────────────────────────
      - MODSEC_RULE_ENGINE=On # On | Off | DetectionOnly
      - MODSEC_AUDIT_ENGINE=RelevantOnly # On | Off | RelevantOnly
      - MODSEC_AUDIT_LOG=/var/log/nginx/modsec_audit.log
      - MODSEC_AUDIT_LOG_TYPE=Serial # Serial | Concurrent
      - MODSEC_AUDIT_LOG_FORMAT=Native # JSON | Native
      - MODSEC_AUDIT_LOG_PARTS=ABIJDEFHZ
      - MODSEC_AUDIT_LOG_RELEVANT_STATUS=^(?:5|4(?!04))
      - MODSEC_AUDIT_STORAGE_DIR=/var/log/nginx/modsec_audit
      # - MODSEC_DEBUG_LOG=/dev/null
      # - MODSEC_DEBUG_LOGLEVEL=0         # 0-9
      - MODSEC_REQ_BODY_ACCESS=On
      - MODSEC_REQ_BODY_LIMIT=13107200
      - MODSEC_REQ_BODY_LIMIT_ACTION=Reject # Reject | ProcessPartial
      - MODSEC_REQ_BODY_NOFILES_LIMIT=131072
      - MODSEC_REQ_BODY_JSON_DEPTH_LIMIT=512
      - MODSEC_RESP_BODY_ACCESS=On
      - MODSEC_RESP_BODY_LIMIT=1048576
      - MODSEC_RESP_BODY_LIMIT_ACTION=ProcessPartial # Reject | ProcessPartial
      - MODSEC_RESP_BODY_MIMETYPE=text/plain text/html text/xml
      # - MODSEC_TMP_DIR=/tmp/modsecurity/tmp
      # - MODSEC_DATA_DIR=/tmp/modsecurity/data
      # - MODSEC_UPLOAD_DIR=/tmp/modsecurity/upload
      # - MODSEC_UPLOAD_FILE_MODE=0600
      # - MODSEC_UPLOAD_KEEP_FILES=Off
      # - MODSEC_PCRE_MATCH_LIMIT=100000
      # - MODSEC_PCRE_MATCH_LIMIT_RECURSION=100000
      # - MODSEC_STATUS_ENGINE=Off

      # ── OWASP CRS ──────────────────────────────────────────────────────────
      - BLOCKING_PARANOIA=2 # 1-4 (reemplaza PARANOIA en CRSv4)
      - DETECTION_PARANOIA=2 # >= BLOCKING_PARANOIA; detecta sin bloquear
      - ANOMALY_INBOUND=5 # puntuación para bloquear request entrante
      - ANOMALY_OUTBOUND=4 # puntuación para bloquear respuesta saliente
      # - REPORTING_LEVEL=4     # 0-5 verbosidad del score en logs
      # - ENFORCE_BODYPROC_URLENCODED=0
      # - VALIDATE_UTF8_ENCODING=0
      # - ALLOWED_METHODS=GET HEAD POST OPTIONS
      # - ALLOWED_HTTP_VERSIONS=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0
      # - ALLOWED_REQUEST_CONTENT_TYPE=|application/x-www-form-urlencoded| |multipart/form-data| |application/json|
      # - MAX_NUM_ARGS=unlimited
      # - ARG_NAME_LENGTH=unlimited
      # - ARG_LENGTH=unlimited
      # - TOTAL_ARG_LENGTH=unlimited
      # - MAX_FILE_SIZE=unlimited
      # - COMBINED_FILE_SIZES=unlimited
      # - RESTRICTED_EXTENSIONS=.asa/ .asax/ ...
      # - RESTRICTED_HEADERS_BASIC=/content-encoding/ /proxy/ ...
      # - STATIC_EXTENSIONS=/.jpg/ /.jpeg/ /.png/ /.gif/ /.js/ /.css/ /.ico/ /.svg/ /.webp/
      # - CRS_DISABLE_PLUGINS=0

      # ── Nginx general ──────────────────────────────────────────────────────
      # - SERVER_NAME=localhost
      # - SERVER_TOKENS=off
      # - PORT=8080
      # - WORKER_CONNECTIONS=1024
      # - KEEPALIVE_TIMEOUT=60s
      # - SET_REAL_IP_FROM=127.0.0.1
      # - REAL_IP_HEADER=X-REAL-IP
      # - REAL_IP_RECURSIVE=on
    depends_on:
      - escuchowsky
      - tumtumpa
      - musthear
    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - /home/docker_webs/contenedores/nginx/logs/nginx:/var/log/nginx
      - ./modsec/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    networks:
      out:
      musica:
        ipv4_address: 172.20.0.10

networks:
  musica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  out:
    external: true
