type: leaky
name: custom/http-404-scan
description: "Enumeracion de rutas y directorios: rafaga de respuestas 404"
filter: "evt.Meta.service == 'http' && evt.Parsed.http_status == '404'"
groupby: "evt.Meta.source_ip"
