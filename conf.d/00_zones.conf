# 00_zones.conf — Rate limiting zones (cargado primero por orden alfabético)
limit_req_zone $binary_remote_addr zone=heavy:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=cover:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=page:10m  rate=60r/m;

# Default server para peticiones sin Host coincidente (e.g. nginx-exporter)
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    location /nginx_status {
        stub_status;
        allow 172.20.0.0/24;
        deny all;
    }

    location / {
        return 444;
    }
}
