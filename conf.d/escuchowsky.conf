# escuchowsky.conf — app_genres (colecciones + géneros)
# Dominio: escuchowsky.duckdns.org → container escuchowsky:5001

server {
    listen 8080;
    server_name escuchowsky.duckdns.org;
    server_tokens off;

    # Solo accesible desde la red interna (nginx-exporter)
    location /nginx_status {
        stub_status;
        allow 172.20.0.0/24;
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name escuchowsky.duckdns.org;
    server_tokens off;

    client_max_body_size 10M;

    ssl_certificate     /etc/nginx/ssl/escuchowsky_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/escuchowsky_key.pem;

    include /etc/nginx/conf.d/server_params.conf;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/setup.conf;

    set $flask         http://escuchowsky:5001;
    set $node_exporter http://node-exporter:9100;
    set $nginx_exporter http://nginx-exporter:9113;

    # ── Endpoints que llaman a APIs externas ─────────────────────────────────
    location ~* ^/api/(scrobbles|enrich_albums|album_info|friends) {
        limit_req zone=heavy burst=4 nodelay;
        limit_req_status 429;
        proxy_pass $flask;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── Proxy de portadas (CoverArtArchive) ───────────────────────────────────
    location /api/cover {
        limit_req zone=cover burst=40 nodelay;
        limit_req_status 429;
        proxy_pass $flask;
        proxy_connect_timeout 15s;
        proxy_read_timeout    15s;
    }

    # ── Resto: UI, colecciones, géneros ──────────────────────────────────────
    location / {
        limit_req zone=page burst=30 nodelay;
        limit_req_status 429;
        proxy_pass $flask;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── Métricas (requiere certificado de cliente firmado por metrics_ca) ─────
    location /metrics/node {
        if ($ssl_client_verify != "SUCCESS") { return 403; }
        proxy_pass $node_exporter/metrics;
        proxy_buffering off;
    }

    location /metrics/nginx {
        if ($ssl_client_verify != "SUCCESS") { return 403; }
        proxy_pass $nginx_exporter/metrics;
        proxy_buffering off;
    }

}
