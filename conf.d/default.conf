# default.conf — catch-all para peticiones sin Host reconocido
# HTTP: cierra silenciosamente (nginx-exporter cubierto en 00_zones.conf)
# HTTPS: cierra sin revelar nada (cert de escuchowsky para evitar warning ssl_stapling)

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 8443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/escuchowsky/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/escuchowsky/key.pem;

    return 444;
}
