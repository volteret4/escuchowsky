# musthear.conf — app_musthear (colecciones no-RYM)
# Dominio: musthear.duckdns.org → container musthear:5002

server {
    listen 8080;
    server_name musthear.duckdns.org;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name musthear.duckdns.org;
    server_tokens off;

    client_max_body_size 10M;

    ssl_certificate     /etc/nginx/ssl/musthear/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/musthear/key.pem;

    include /etc/nginx/conf.d/server_params.conf;

    modsecurity on;

    set $flask http://musthear:5002;

    # ── Endpoints que llaman a APIs externas ─────────────────────────────────
    location ~* ^/api/(scrobbles|enrich_albums|album_info|friends) {
        limit_req zone=heavy burst=4 nodelay;
        limit_req_status 429;
        proxy_pass $flask;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── Proxy de portadas (CoverArtArchive) ───────────────────────────────────
    location /api/cover {
        limit_req zone=cover burst=40 nodelay;
        limit_req_status 429;
        proxy_pass $flask;
        proxy_connect_timeout 15s;
        proxy_read_timeout    15s;
    }

    # ── Resto: UI, /api/check_user, /api/musthear ─────────────────────────
    location / {
        limit_req zone=page burst=30 nodelay;
        limit_req_status 429;
        proxy_pass $flask;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
