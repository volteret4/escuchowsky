# server_params.conf — Parámetros comunes de server block
# include /etc/nginx/conf.d/server_params.conf; dentro de cada server {}
# Nota: ssl_certificate y ssl_certificate_key van en cada server por separado

# ── TLS ───────────────────────────────────────────────────────────────────────
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_dhparam               /etc/nginx/ssl/dhparam.pem;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
ssl_stapling              on;
ssl_stapling_verify       on;

# ── mTLS para métricas ────────────────────────────────────────────────────────
# optional: los clientes normales no necesitan cert, pero /metrics/* lo exigen
ssl_verify_client      optional;
ssl_client_certificate /etc/nginx/ssl/metrics_ca.crt;

# ── Security headers ──────────────────────────────────────────────────────────
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff"          always;
add_header X-Frame-Options           "SAMEORIGIN"       always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' cloud.umami.is cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.youtube.com; connect-src 'self' https://cloud.umami.is https://api-gateway.umami.dev https://ws.audioscrobbler.com https://api.listenbrainz.org https://musicbrainz.org https://coverartarchive.org; object-src 'none'; base-uri 'self';" always;

# ── Logs ──────────────────────────────────────────────────────────────────────
access_log /var/log/nginx/access.log;
error_log  /var/log/nginx/error.log warn;

# ── Proxy headers ─────────────────────────────────────────────────────────────
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_redirect   off;
proxy_buffering  off;
proxy_cache      off;
