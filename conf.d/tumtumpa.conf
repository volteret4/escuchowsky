# tumtumpa.conf — tumtumpa.duckdns.org (dominio unificado)
#   /                 → índice nginx (dos botones)
#   /recomendaciones/ → tumtumpa:5001 (app_discover)
#   /colecciones/     → musthear:5002 (app_musthear)
#
# sub_filter inyecta data-api-base en <html> y reescribe rutas absolutas
# de /static/ e /img/ en respuestas text/html (JS no se toca).

server {
    listen 8080;
    server_name tumtumpa.duckdns.org;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name tumtumpa.duckdns.org;
    server_tokens off;

    client_max_body_size 10M;

    ssl_certificate     /etc/nginx/ssl/tumtumpa/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/tumtumpa/key.pem;

    include /etc/nginx/conf.d/server_params.conf;

    modsecurity on;

    # ── Índice ────────────────────────────────────────────────────────────────
    location = / {
        limit_req zone=page burst=30 nodelay;
        limit_req_status 429;
        default_type 'text/html; charset=utf-8';
        return 200 '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>tumtumpa</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#16181c;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}.wrap{text-align:center;padding:2rem}h1{color:#e8e6e3;font-size:2rem;margin:0 0 .4rem;font-weight:400}.sub{color:#737880;font-size:.82rem;margin:0 0 2.5rem;letter-spacing:.08em;font-family:monospace}.btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}a{display:block;padding:1rem 2.2rem;background:#1e2028;border:1px solid #2e3340;border-radius:8px;color:#e8e6e3;text-decoration:none;font-size:.88rem}a:hover{border-color:#5a6475}</style></head><body><div class="wrap"><h1>tumtumpa</h1><p class="sub">elige una herramienta</p><div class="btns"><a href="/recomendaciones/">Recomendaciones</a><a href="/colecciones/">Colecciones</a></div></div></body></html>';
    }

    # ── /colecciones → musthear:5002 ─────────────────────────────────────────

    location ~* ^/colecciones/api/(scrobbles|enrich_albums|album_info|friends) {
        limit_req zone=heavy burst=4 nodelay;
        limit_req_status 429;
        rewrite ^/colecciones(/.*)$ $1 break;
        proxy_pass http://musthear:5002;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location /colecciones/api/cover {
        limit_req zone=cover burst=40 nodelay;
        limit_req_status 429;
        rewrite ^/colecciones(/.*)$ $1 break;
        proxy_pass http://musthear:5002;
        proxy_connect_timeout 15s;
        proxy_read_timeout    15s;
    }

    location /colecciones/ {
        limit_req zone=page burst=30 nodelay;
        limit_req_status 429;

        proxy_buffering on;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '<html' '<html data-api-base="/colecciones"';
        sub_filter 'href="/static/' 'href="/colecciones/static/';
        sub_filter 'href="/img/'    'href="/colecciones/img/';
        sub_filter 'src="/static/'  'src="/colecciones/static/';
        sub_filter 'src="/img/'     'src="/colecciones/img/';

        rewrite ^/colecciones(/.*)$ $1 break;
        proxy_pass http://musthear:5002;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── /recomendaciones → tumtumpa:5001 ─────────────────────────────────────

    location ~* ^/recomendaciones/api/(scrobbles|enrich_albums|album_info|friends) {
        limit_req zone=heavy burst=4 nodelay;
        limit_req_status 429;
        rewrite ^/recomendaciones(/.*)$ $1 break;
        proxy_pass http://tumtumpa:5001;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location /recomendaciones/api/cover {
        limit_req zone=cover burst=40 nodelay;
        limit_req_status 429;
        rewrite ^/recomendaciones(/.*)$ $1 break;
        proxy_pass http://tumtumpa:5001;
        proxy_connect_timeout 15s;
        proxy_read_timeout    15s;
    }

    location /recomendaciones/ {
        limit_req zone=page burst=30 nodelay;
        limit_req_status 429;

        proxy_buffering on;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '<html'          '<html data-api-base="/recomendaciones"';
        sub_filter 'href="/static/' 'href="/recomendaciones/static/';
        sub_filter 'href="/img/'    'href="/recomendaciones/img/';
        sub_filter 'href="/manifest' 'href="/recomendaciones/manifest';
        sub_filter 'src="/static/'  'src="/recomendaciones/static/';
        sub_filter 'src="/img/'     'src="/recomendaciones/img/';

        rewrite ^/recomendaciones(/.*)$ $1 break;
        proxy_pass http://tumtumpa:5001;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
