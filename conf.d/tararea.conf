# tararea.conf — tararea.duckdns.org
# /recomendaciones → tumtumpa:5001 (app_discover)
# /colecciones     → musthear:5002 (app_musthear)
#
# Sub_filter injects data-api-base on the <html> tag so JS can prefix
# all /api/ calls correctly when served under a subpath.
# JS files are NOT rewritten (sub_filter_types text/html only).

server {
    listen 8080;
    server_name tararea.duckdns.org;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name tararea.duckdns.org;
    server_tokens off;

    client_max_body_size 10M;

    ssl_certificate     /etc/nginx/ssl/tararea/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/tararea/key.pem;

    include /etc/nginx/conf.d/server_params.conf;

    modsecurity on;

    # ── /colecciones → musthear:5002 ─────────────────────────────────────────

    location ~* ^/colecciones/api/(scrobbles|enrich_albums|album_info|friends) {
        limit_req zone=heavy burst=4 nodelay;
        limit_req_status 429;
        rewrite ^/colecciones(/.*)$ $1 break;
        proxy_pass http://musthear:5002;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location /colecciones/api/cover {
        limit_req zone=cover burst=40 nodelay;
        limit_req_status 429;
        rewrite ^/colecciones(/.*)$ $1 break;
        proxy_pass http://musthear:5002;
        proxy_connect_timeout 15s;
        proxy_read_timeout    15s;
    }

    location /colecciones/ {
        limit_req zone=page burst=30 nodelay;
        limit_req_status 429;

        # Inject data-api-base and rewrite absolute paths in HTML only
        proxy_buffering on;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter '<html' '<html data-api-base="/colecciones"';
        sub_filter 'href="/' 'href="/colecciones/';
        sub_filter 'src="/' 'src="/colecciones/';

        rewrite ^/colecciones(/.*)$ $1 break;
        proxy_pass http://musthear:5002;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── /recomendaciones → tumtumpa:5001 ─────────────────────────────────────

    location ~* ^/recomendaciones/api/(scrobbles|enrich_albums|album_info|friends) {
        limit_req zone=heavy burst=4 nodelay;
        limit_req_status 429;
        rewrite ^/recomendaciones(/.*)$ $1 break;
        proxy_pass http://tumtumpa:5001;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location /recomendaciones/api/cover {
        limit_req zone=cover burst=40 nodelay;
        limit_req_status 429;
        rewrite ^/recomendaciones(/.*)$ $1 break;
        proxy_pass http://tumtumpa:5001;
        proxy_connect_timeout 15s;
        proxy_read_timeout    15s;
    }

    location /recomendaciones/ {
        limit_req zone=page burst=30 nodelay;
        limit_req_status 429;

        proxy_buffering on;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter '<html' '<html data-api-base="/recomendaciones"';
        sub_filter 'href="/' 'href="/recomendaciones/';
        sub_filter 'src="/' 'src="/recomendaciones/';

        rewrite ^/recomendaciones(/.*)$ $1 break;
        proxy_pass http://tumtumpa:5001;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── Root redirect ─────────────────────────────────────────────────────────
    location = / {
        return 302 /recomendaciones/;
    }

    location / {
        return 404;
    }
}
