## rsyslog — servidor local (receptor)
## Deploy: /etc/rsyslog.d/10-remote-receive.conf
## Reload: systemctl restart rsyslog
##
## Escucha solo en loopback — el reverse tunnel SSH hace llegar aquí
## los logs del servidor AWS. Nada externo puede conectar a este puerto.

module(load="imtcp")
input(type="imtcp" port="10514" address="127.0.0.1")

# Logs organizados por host remoto y fecha
template(
    name="RemoteHostLogs"
    type="string"
    string="/var/log/remote/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log"
)

if $inputname == "imtcp" then {
    action(
        type="omfile"
        dynaFile="RemoteHostLogs"
        createDirs="on"
        dirCreateMode="0750"
        fileCreateMode="0640"
        fileOwner="syslog"
        fileGroup="adm"
    )
    stop
}
