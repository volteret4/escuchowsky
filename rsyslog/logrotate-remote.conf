## logrotate — logs remotos recibidos por rsyslog
## Deploy: /etc/logrotate.d/rsyslog-remote
## Se ejecuta automáticamente por logrotate (típicamente via cron.daily)

/var/log/remote/*/*.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 0640 syslog adm
    sharedscripts
    postrotate
        systemctl kill -s HUP rsyslog.service 2>/dev/null || true
    endscript
}
