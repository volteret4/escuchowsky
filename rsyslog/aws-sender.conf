## rsyslog — servidor AWS (emisor)
## Deploy: /etc/rsyslog.d/99-remote-forward.conf
## Reload: systemctl restart rsyslog
##
## Los logs se envían a localhost:10514, que es el extremo del reverse tunnel
## SSH que el servidor local mantiene abierto. rsyslog no sabe nada de IPs
## remotas; el túnel se encarga del transporte.
##
## IMPORTANTE: el túnel debe estar activo para que lleguen logs.
## Si el túnel cae, rsyslog hace cola en disco y reintenta automáticamente.

# Envío al túnel SSH local (127.0.0.1 — nunca sale a internet directamente)
*.* action(
    type="omfwd"
    Target="127.0.0.1"
    Port="10514"
    Protocol="tcp"
    action.resumeRetryCount="-1"
    queue.type="disk"
    queue.filename="remote_fwd_queue"
    queue.maxDiskSpace="200m"
    queue.saveOnShutdown="on"
    queue.highWatermark="9000"
    queue.lowWatermark="1000"
)
